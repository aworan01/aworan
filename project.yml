name: Watchly
options:
  bundleIdPrefix: com.watchly
  deploymentTarget:
    tvOS: '16.0'
packages:
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm.git
    revision: e932bbd488872fdb74f6654d28c2f291eae03daf
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 2
targets:
  Watchly:
    type: application
    platform: tvOS
    sources:
      - Sources
      - Native/TorrentBridge.h
      - path: Resources
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Watchly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Watchly discovers torrent peers and streams video on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchly.tv
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Watchly-Bridging-Header.h
        HEADER_SEARCH_PATHS: ['$(SRCROOT)/Native']
        LIBRARY_SEARCH_PATHS: ['$(SRCROOT)/vendor/native/$(PLATFORM_NAME)']
        OTHER_LDFLAGS: ['$(inherited)', '-lWatchlyTorrent', '-ltorrent-rasterbar', '-lssl', '-lcrypto', '-lc++', '-lz']
        TARGETED_DEVICE_FAMILY: '3'
    dependencies:
      - package: VLCKit
        product: VLCKitSPM
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
schemes:
  Watchly:
    build:
      targets:
        Watchly: all
    run:
      config: Debug
    archive:
      config: Release
